name: Robots auto-like

on:
  # GitHub no cumple el cron: pide lo que pidas, dispara dos o tres veces al
  # dia y a deshora. El repositorio publico corrio a las 21:45 y a la 01:50, y
  # luego diez horas en blanco. Peleando con eso se pierde el tiempo.
  #
  # La estrategia se invierte: NO depender de que dispare a menudo. En un
  # repositorio publico los minutos no se cuentan y un trabajo puede durar
  # seis horas, asi que POCAS vueltas y MUY LARGAS. Tres citas cubren las
  # dieciseis horas de ventana, y si GitHub se salta una, las otras dos tapan
  # casi todo el dia igual.
  #
  # El robot se para solo al salir de la ventana horaria, asi que una vuelta
  # larga nunca se sale del horario aunque le sobre tiempo.
  schedule:
    - cron: '5 6,12,18 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar (ignora la cadencia)'
        required: false
        default: 'true'

# Una sola vuelta a la vez. Con vueltas de cinco horas y media, dos solapadas
# serian dos robots con la misma cuenta pisandose el cursor de cada objetivo.
# La segunda espera a que acabe la primera.
concurrency:
  group: auto-like
  cancel-in-progress: false

jobs:
  like:
    runs-on: ubuntu-latest
    # Red de seguridad: sin esto, un bucle atascado (p.ej. reintentos sin límite
    # ante un error persistente de la API) puede correr hasta las 6h (máximo de
    # GitHub) y agotar la cuota mensual de minutos en un solo run. Margen sobre
    # RUN_MINUTES, que es quien corta de verdad.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Sin los secrets configurados el robot no puede hacer nada. Salimos
      # limpiamente en vez de fallar: un repo recien clonado no deberia
      # mandarte un correo de error cada 15 minutos. Ver MIGRACION.md.
      - name: Comprobar secrets
        id: secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          BSKY_ACCOUNTS: ${{ secrets.BSKY_ACCOUNTS }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$SUPABASE_OWNER_ID" ] || [ -z "$BSKY_ACCOUNTS" ]; then
            echo "::notice::Faltan secrets (ver MIGRACION.md). No hago nada."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Procesar robots
        if: steps.secrets.outputs.listo == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          BSKY_ACCOUNTS: ${{ secrets.BSKY_ACCOUNTS }}
          BSKY_SERVICE: ${{ vars.BSKY_SERVICE || 'https://bsky.social' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          # El robot para SOLO y cierra bien (guarda el run y la próxima cita).
          # timeout-minutes queda como red de seguridad externa: si salta, es
          # que algo se atascó, no el funcionamiento normal.
          #
          # EL PRESUPUESTO MANDA. Un repo privado trae 2.000 minutos de
          # Actions al mes, y eso es lo que de verdad limita al robot:
          #   2.000 min/mes ÷ 30 días ≈ 66 min/día
          #   menos lo que gastan los despliegues (~2 min cada uno)
          #   = unos 60 min/día de robot
          # Con 15 min por vuelta salen CUATRO vueltas al día, y a ~9 likes
          # por minuto (pausas de 5-8 s) son unos 540 likes diarios.
          #
          # Vueltas cortas y repartidas, y no dos largas: para una cuenta que
          # da likes, repartir se parece más a cómo lo haría una persona.
          #
          # Si el repositorio se hiciera público, los minutos dejan de estar
          # medidos y esto puede subir a 30 sin pensarlo.
          RUN_MINUTES: '330'
        run: node scripts/auto-like.mjs
